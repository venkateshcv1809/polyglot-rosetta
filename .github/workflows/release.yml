name: Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Project Toolchains
        uses: jdx/mise-action@v4
        with:
          version: '2026.10.25'

      - name: Verify Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(go run ./cmd/prosetta version)"
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "Release tag $RELEASE_TAG does not match embedded version $version" >&2
            exit 1
          fi

      - name: Run Build Pipeline
        run: mise exec -- just release

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            bin/prosetta-*-linux-amd64
            bin/prosetta-*-linux-arm64
            bin/prosetta-*-darwin-amd64
            bin/prosetta-*-darwin-arm64
            bin/prosetta-*-windows-amd64.exe
            bin/prosetta-*-windows-arm64.exe
            dist/prosetta.wasm
            dist/wasm_exec.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
