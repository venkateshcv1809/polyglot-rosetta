name: Publish Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'problems/**'
      - 'templates/**'
      - 'cmd/generate/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'justfile'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/pages/**'
      - '.github/workflows/publish-catalog.yml'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Catalog Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Catalog Toolchains
        uses: jdx/mise-action@v4
        with:
          version: '2026.10.25'
          install_args: go just

      - name: Build Catalog
        run: |
          just release-catalog
          mkdir -p .github/pages/catalog
          cp dist/problems/* .github/pages/catalog/

      - name: Build Catalog Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: .github/pages
          destination: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Catalog to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
