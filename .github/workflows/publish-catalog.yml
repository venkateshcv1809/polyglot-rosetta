name: Publish Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'problems/**'
      - 'templates/**'
      - 'cmd/generate/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'version.go'
      - 'version.json'
      - 'justfile'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/pages/**'
      - '.github/workflows/publish-catalog.yml'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Catalog Quality Gate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml

  build:
    name: Build Catalog Assets
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Catalog Toolchains
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.10.25'
          install_args: --locked go just
          cache: false

      - name: Build Catalog
        run: |
          just release-catalog
          mkdir -p .github/pages/catalog
          cp dist/problems/* .github/pages/catalog/

      - name: Build Catalog Pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: .github/pages
          destination: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy Catalog to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
